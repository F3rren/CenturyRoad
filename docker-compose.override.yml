# Applied automatically in dev (docker compose up).
# Overrides prod targets with hot-reload mounts and dev profiles, publishes the default
# ports, and turns restarts off: mvnw exits on a compile error, and restart: unless-stopped
# would loop it forever instead of leaving the error where you can read it.
# Prometheus (9090) and Grafana (3000) are already published on localhost by the base file.
services:

  db:
    restart: "no"
    ports:
      - "5432:5432"

  auth-service:
    build:
      target: dev
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./service/auth-service:/app
      - maven_cache:/root/.m2
    ports:
      - "8081:8081"
      - "5006:5006"   # remote debug

  gateway:
    build:
      target: dev
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./service/gateway:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
      - "5007:5007"   # remote debug

  history-service:
    build:
      target: dev
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./service/history-service:/app
      - maven_cache:/root/.m2
    ports:
      - "8082:8082"
      - "5008:5008"   # remote debug

  prometheus:
    restart: "no"

  grafana:
    restart: "no"

volumes:
  maven_cache:
