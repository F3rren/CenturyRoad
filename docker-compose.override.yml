# Applied automatically in dev (docker compose up).
# Overrides prod targets with hot-reload mounts and dev profiles.
services:

  backend:
    build:
      target: dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
      - "5005:5005"   # remote debug

volumes:
  maven_cache:
