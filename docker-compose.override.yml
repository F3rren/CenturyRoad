# Applied automatically in dev (docker compose up).
# Overrides prod targets with hot-reload mounts and dev profiles.
services:

  auth-service:
    build:
      target: dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./service/auth-service:/app
      - maven_cache:/root/.m2
    ports:
      - "8081:8081"
      - "5006:5006"   # remote debug

  gateway:
    build:
      target: dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./service/gateway:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
      - "5007:5007"   # remote debug

volumes:
  maven_cache:
