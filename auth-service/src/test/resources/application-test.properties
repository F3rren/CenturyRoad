# Test-only values, never used outside this profile. The secret is long enough for
# HS256 (32+ decoded bytes) and nothing else - it signs no token anyone ever sees.
jwt.secret=Y2VudHVyeS1yb2FkLXRlc3Qtc2VjcmV0LWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmctZm9yLWhzMjU2
jwt.expiration-ms=3600000

# Low on purpose: tests that check the limiter should not need dozens of requests to
# trip it.
auth.rate-limit.max-attempts=3
auth.rate-limit.window-ms=60000

# Disabled unless a test specifically sets both: an empty users table would otherwise
# get a bootstrap admin in every test class that starts the full context.
bootstrap.admin.email=
bootstrap.admin.password=

spring.jpa.hibernate.ddl-auto=validate
logging.level.root=WARN
