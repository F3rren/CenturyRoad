services:

  # ─── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-centuryroad}
      POSTGRES_USER:     ${POSTGRES_USER:-centuryroad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-centuryroad}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-centuryroad} -d ${POSTGRES_DB:-centuryroad}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    environment:
      SPRING_PROFILES_ACTIVE:       prod
      SPRING_DATASOURCE_URL:        jdbc:postgresql://db:5432/${POSTGRES_DB:-centuryroad}
      SPRING_DATASOURCE_USERNAME:   ${POSTGRES_USER:-centuryroad}
      SPRING_DATASOURCE_PASSWORD:   ${POSTGRES_PASSWORD:-centuryroad}
      JWT_SECRET:                   ${JWT_SECRET:-change-me-in-production-use-32-chars}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    ports:
      - "80:80"
    depends_on:
      - backend

  # ─── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # ─── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
