services:

  # ─── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Auth service ────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./service/auth-service
      dockerfile: Dockerfile
      target: prod
    environment:
      SPRING_PROFILES_ACTIVE:     prod
      SPRING_DATASOURCE_URL:      jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET:                 ${JWT_SECRET}
      JWT_EXPIRATION_MS:          ${JWT_EXPIRATION_MS}
      # Creating a user needs an admin token, so an empty database has no way to get
      # its first administrator without these. Inert unless both are set AND the users
      # table is empty - see FirstAdminBootstrap. Clear them again after the first
      # login and restart, or they sit in the container environment for good.
      BOOTSTRAP_ADMIN_EMAIL:      ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD:   ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  # ─── Gateway ─────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./service/gateway
      dockerfile: Dockerfile
      target: prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTH_SERVICE_URI:       http://auth-service:8081
    # No ports here on purpose: in prod the proxy below is the only way in. The dev
    # override republishes 8080 so local work keeps talking to the gateway directly.
    depends_on:
      - auth-service

  # ─── Reverse proxy (TLS termination) ─────────────────────────────────────────
  # Opt-in, so "docker compose up" stays the plain-HTTP dev stack it is today.
  # Start it with: docker compose --profile proxy up -d
  proxy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      HSTS_MAX_AGE:  ${HSTS_MAX_AGE:-300}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - gateway

  # ─── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - gateway

  # ─── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  prometheus_data:
  grafana_data:
