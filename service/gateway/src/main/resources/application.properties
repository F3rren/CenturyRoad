spring.application.name=gateway

server.port=${GATEWAY_PORT:8080}

# Routes - evaluated in declaration order, first match wins. The auth-service routes
# must come before the backend catch-all or it would swallow them first. Neither
# downstream service needs a path prefix stripped: both already expose their real
# /api/... paths, so the gateway forwards requests unmodified.
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:http://auth-service:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/admin/users/**,/api/me/**

spring.cloud.gateway.routes[1].id=backend
spring.cloud.gateway.routes[1].uri=${BACKEND_SERVICE_URI:http://backend:8080}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/**

# Actuator - same pair every other service exposes, so this one shows up on the same
# Prometheus/Grafana dashboards without a special case.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

logging.level.root=INFO
logging.level.centuryroad=DEBUG

# Locked down by default, same reasoning as auth-service: forgetting
# SPRING_PROFILES_ACTIVE should land on the hardened profile, not a permissive default.
spring.profiles.default=prod
