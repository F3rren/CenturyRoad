spring.application.name=century-road

# DataSource – values injected by Docker Compose env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/centuryroad}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:centuryroad}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:centuryroad}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator – expose prometheus endpoint
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

# JWT
jwt.secret=${JWT_SECRET:change-me-in-production-use-32-chars}
jwt.expiration-ms=86400000
