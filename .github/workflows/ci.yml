name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.service }} build, test and quality
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, gateway, history-service]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: cd service/${{ matrix.service }} && chmod +x mvnw

      - name: Build, test and quality checks
        run: cd service/${{ matrix.service }} && ./mvnw --batch-mode --errors --fail-at-end clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: service/${{ matrix.service }}/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports-${{ matrix.service }}
          path: |
            service/${{ matrix.service }}/target/surefire-reports
            service/${{ matrix.service }}/target/failsafe-reports
          if-no-files-found: ignore
