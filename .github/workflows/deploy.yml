name: Deploy

# Runs once CI has passed on a push to main, and can be started by hand from the Actions tab.
# It reaches the server over SSH and runs infra/deploy/deploy.sh there. Nothing is built on
# GitHub's side, and no application secret passes through GitHub: .env stays on the server.
#
# The environment, its variables and secrets, and the server setup are described under
# "Running it on a VPS" in the README.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway: a rebuild cut short is worse than one
# that finishes late.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    # workflow_run fires for every CI run, whatever its outcome and whatever started it. Only a
    # green push to main gets through, and a manual run only from main: choosing another branch
    # in the "Run workflow" menu must not put that branch on the server.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          # The exact commit CI verified, not whatever main has become since.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the production environment (see the README)"
              exit 1
            fi
          done

          # Three of these end up inside a command line run on the server, so refuse anything
          # that is not the shape it should be rather than trusting where it came from.
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]                || { echo "::error::not a commit id: $DEPLOY_SHA"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]          || { echo "::error::DEPLOY_PATH must be an absolute path"; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]          || { echo "::error::DEPLOY_USER is not a valid user name"; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]] || { echo "::error::DEPLOY_HOST is not a valid host"; exit 1; }

          install -d -m 700 ~/.ssh
          key="$HOME/.ssh/deploy_key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          chmod 600 "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          # StrictHostKeyChecking=yes against the pinned host key: a server that is not the one
          # recorded in DEPLOY_KNOWN_HOSTS is refused, never trusted on first use.
          ssh -i "$key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch --quiet origin main && git merge --ff-only '$DEPLOY_SHA' && bash ./infra/deploy/deploy.sh"

          echo "Deployed \`${DEPLOY_SHA:0:7}\` to \`$DEPLOY_HOST\`." >> "$GITHUB_STEP_SUMMARY"
